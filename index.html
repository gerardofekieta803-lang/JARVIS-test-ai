<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS AI</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #050816;
            color: #00eaff;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin-top: 50px;
            letter-spacing: 4px;
            font-size: 36px;
            text-shadow: 0 0 15px #00eaff;
        }

        p {
            color: #ffffff;
            font-size: 16px;
        }

        .jarvis-circle {
            width: 150px;
            height: 150px;
            border: 3px solid #00eaff;
            border-radius: 50%;
            margin: 40px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 0 25px #00eaff;
            animation: pulse 2s infinite;
        }

        button {
            background: transparent;
            color: #00eaff;
            border: 2px solid #00eaff;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
        }

        button:hover {
            background: #00eaff;
            color: #050816;
            box-shadow: 0 0 20px #00eaff;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 10px #00eaff;
            }

            50% {
                box-shadow: 0 0 30px #00eaff;
            }

            100% {
                box-shadow: 0 0 10px #00eaff;
            }
        }
    </style>
</head>

<body>

    <h1>JARVIS AI</h1>

    <p>Your Personal AI Assistant</p>

    <div class="jarvis-circle">
        AI
    </div>

    <p id="status">System Ready</p>

    <button onclick="startJarvis()">
        Activate JARVIS
    </button>

    <script>
        function startJarvis() {
            document.getElementById("status").textContent =
                "JARVIS Interface Activated!";
        }
    </script>

</body>
</html>
